; Firmware example for a generic ESP32-S3 devkit, NOT a pin-verified ESP32-S3 CAM.
; Edit include/config.h to match YOUR board's available GPIO, camera and PN532 mode.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = adafruit/Adafruit PN532@^1.3.4
